[package]
name = "get_iplayer_rs_gui"
version = "1.0.0"
edition = "2021"
authors = ["get_iplayer_rs Contributors"]
description = "GUI application for get_iplayer_rs - Lists and records BBC iPlayer TV and BBC Sounds radio programmes"
license = "GPL-3.0-or-later"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui_extras = { version = "0.29", features = ["all_loaders"] }
rfd = { version = "0.18", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "cookies", "stream"] }
quick-xml = "0.42"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.13"
url = "2.5"
htmlescape = "0.3"
futures-util = "0.3"
tempfile = "3.17"
indicatif = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.14", default-features = false, features = ["gtk3"] }

# Shared crate with common functionality
get_iplayer_common = { package = "get_iplayer_rs", path = ".." }

[[bin]]
name = "get_iplayer_rs_gui"
path = "src/main.rs"

name: Release Automation

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug output'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - architecture: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Linux build target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.architecture }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.architecture }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build CLI binary
        run: cargo build --release --locked --package get_iplayer_rs --bin get_iplayer_rs --target ${{ matrix.target }}

      - name: Create release assets
        run: |
          mkdir -p release-assets
          cp target/${{ matrix.target }}/release/get_iplayer_rs release-assets/get_iplayer_rs-${{ matrix.architecture }}-linux
          cd release-assets
          sha256sum get_iplayer_rs-${{ matrix.architecture }}-linux > SHA256SUMS-${{ matrix.architecture }}

      - name: Upload architecture assets
        uses: actions/upload-artifact@v4
        with:
          name: cli-release-${{ matrix.architecture }}
          path: release-assets/*
          if-no-files-found: error

  release:
    runs-on: ubuntu-24.04
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download architecture assets
        uses: actions/download-artifact@v4
        with:
          pattern: cli-release-*
          path: release-assets
          merge-multiple: true

      - name: Read CLI version
        id: version
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            release-assets/get_iplayer_rs-x86_64-linux
            release-assets/SHA256SUMS-x86_64
            release-assets/get_iplayer_rs-aarch64-linux
            release-assets/SHA256SUMS-aarch64

name: Build and Push Docker Image

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: henkez/get_iplayer_rs
          tags: |
            type=raw,value=pr-${{ github.event.pull_request.number }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from commit message or use default
        id: version
        run: |
          # Extract version from commit message using semantic versioning pattern
          # If no version found, default to 0.1.0
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "VERSION=0.1.0" >> $GITHUB_ENV
          else
            # Remove 'v' prefix
            echo "VERSION=${VERSION#v}" >> $GITHUB_ENV
          fi

      - name: Tag with version and latest
        run: |
          docker pull henkez/get_iplayer_rs:pr-${{ github.event.number }}
          docker tag henkez/get_iplayer_rs:pr-${{ github.event.number }} henkez/get_iplayer_rs:${{ env.VERSION }}
          docker tag henkez/get_iplayer_rs:pr-${{ github.event.number }} henkez/get_iplayer_rs:latest
          docker push henkez/get_iplayer_rs:${{ env.VERSION }}
          docker push henkez/get_iplayer_rs:latest
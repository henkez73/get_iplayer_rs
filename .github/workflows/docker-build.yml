name: Build and Push Docker Image

on:
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/release.yml'
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug output'
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for documentation-only changes
        id: check_docs
        run: |
          # Skip build if this is a PR and only markdown files have changed
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Check if we have a parent commit to compare against
            if git rev-parse HEAD~1 > /dev/null 2>&1; then
              CHANGED_FILES_COUNT=$(git diff --name-only HEAD~1 HEAD | grep -v "\.md$" | wc -l)
              if [ "$CHANGED_FILES_COUNT" -eq 0 ]; then
                echo "Only documentation files changed, skipping build"
                exit 0
              fi
            else
              # If there's no parent commit (e.g., first commit in a new branch), continue with build
              echo "No parent commit found, proceeding with build"
            fi
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: henkez/get_iplayer_rs
          tags: |
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from commit message or use default
        id: version
        run: |
          # Extract version from commit message using semantic versioning pattern
          # If no version found, default to 0.1.0
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$COMMIT_MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "VERSION=0.1.0" >> $GITHUB_ENV
          else
            # Remove 'v' prefix
            echo "VERSION=${VERSION#v}" >> $GITHUB_ENV
          fi

      - name: Tag with version and latest
        run: |
          docker pull henkez/get_iplayer_rs:pr-${{ github.event.number }}
          docker tag henkez/get_iplayer_rs:pr-${{ github.event.number }} henkez/get_iplayer_rs:${{ env.VERSION }}
          docker tag henkez/get_iplayer_rs:pr-${{ github.event.number }} henkez/get_iplayer_rs:latest
          docker push henkez/get_iplayer_rs:${{ env.VERSION }}
          docker push henkez/get_iplayer_rs:latest